<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Links — Cristian Paez Jr</title>
  <meta name="description" content="All of Cristian Paez Jr’s links — web projects, socials, and more." />
  <link rel="icon" href="../favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="../favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Gloria+Hallelujah&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3f4f6;
      --bg-soft: #e8eaee;
      --surface: #ffffff;
      --ink: #14151a;
      --ink-muted: #5c616b;
      --border: rgba(20, 21, 26, 0.08);
      --accent: #89CFF0;
      --radius-pill: 999px;
      --font-display: "Gloria Hallelujah", cursive;
      --font-body: "DM Sans", sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --shadow-soft: 0 10px 30px rgba(20, 21, 26, 0.06);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #dfe7ef 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #e4ebe6 0%, transparent 50%),
        linear-gradient(180deg, #f7f8fa 0%, var(--bg) 40%, #eef0f3 100%);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    main {
      width: 100%;
      max-width: 28rem;
      margin: 0 auto;
      padding: clamp(2rem, 6vw, 3.25rem) clamp(1.15rem, 5vw, 1.75rem) 3.5rem;
    }

    .page-intro {
      margin-bottom: 1.75rem;
      text-align: center;
    }

    .links-avatar {
      width: 5.5rem;
      height: 5.5rem;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      border: 3px solid #fff;
      box-shadow: var(--shadow-soft);
      margin: 0 auto 0.85rem;
      display: block;
    }

    .page-intro h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 6vw, 3rem);
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 0.35rem;
    }

    .page-intro p {
      color: var(--ink-muted);
      font-size: 0.98rem;
    }

    .link-group {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-bottom: 1.75rem;
    }

    .link-group h2 {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      text-align: center;
      margin-bottom: 0.15rem;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      min-height: 3.35rem;
      padding: 0.55rem 1rem 0.55rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), border-color 0.25s var(--ease);
    }

    .link-btn:hover {
      transform: translateY(-2px);
      border-color: rgba(137, 207, 240, 0.7);
      box-shadow: 0 10px 24px rgba(20, 21, 26, 0.1);
    }

    .link-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .link-btn img {
      width: 2.15rem;
      height: 2.15rem;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      background: var(--bg-soft);
      flex-shrink: 0;
    }

    .link-btn span {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .link-icons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.55rem;
      margin-top: 0.35rem;
    }

    .link-icons a {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s var(--ease), border-color 0.25s var(--ease);
    }

    .link-icons a:hover {
      transform: translateY(-2px);
      border-color: rgba(137, 207, 240, 0.7);
    }

    .link-icons a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .link-icons img {
      width: 1.15rem;
      height: 1.15rem;
      display: block;
    }
  </style>
</head>
