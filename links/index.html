  <style>
    :root {
      --bg: #f3f4f6;
      --bg-soft: #e8eaee;
      --surface: #ffffff;
      --ink: #14151a;
      --ink-muted: #5c616b;
      --border: rgba(20, 21, 26, 0.08);
      --accent: #89CFF0;
      --accent-hover: #6eb8e3;
      --accent-text: #14151a;
      --radius-pill: 999px;
      --font-display: "Gloria Hallelujah", cursive;
      --font-body: "DM Sans", sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --shadow-soft: 0 10px 30px rgba(20, 21, 26, 0.06);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      color: var(--ink);
      position: relative;
      overflow-x: hidden;
      background: #eaf4ff;
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .links-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .links-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(58px);
      opacity: 0.78;
      will-change: transform;
    }

    .links-blob-a {
      width: min(78vw, 30rem);
      height: min(78vw, 30rem);
      background: #89cff0;
      top: -14%;
      left: -20%;
      animation: links-lava-a 14s ease-in-out infinite;
    }

    .links-blob-b {
      width: min(70vw, 27rem);
      height: min(70vw, 27rem);
      background: #ffb7d5;
      top: 24%;
      right: -22%;
      animation: links-lava-b 17s ease-in-out infinite;
    }

    .links-blob-c {
      width: min(64vw, 25rem);
      height: min(64vw, 25rem);
      background: #ffe08a;
      bottom: -16%;
      left: 6%;
      animation: links-lava-c 16s ease-in-out infinite;
    }

    .links-blob-d {
      width: min(60vw, 23rem);
      height: min(60vw, 23rem);
      background: #9ef0c8;
      bottom: 14%;
      right: 4%;
      animation: links-lava-d 18s ease-in-out infinite;
    }

    @keyframes links-lava-a {
      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      25% {
        transform: translate(18vw, 12vh) scale(1.14);
      }

      50% {
        transform: translate(8vw, 24vh) scale(0.92);
      }

      75% {
        transform: translate(-10vw, 10vh) scale(1.08);
      }
    }

    @keyframes links-lava-b {
      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      25% {
        transform: translate(-16vw, 10vh) scale(1.1);
      }

      50% {
        transform: translate(-8vw, -14vh) scale(0.9);
      }

      75% {
        transform: translate(-20vw, 6vh) scale(1.06);
      }
    }

    @keyframes links-lava-c {
      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      25% {
        transform: translate(14vw, -12vh) scale(1.12);
      }

      50% {
        transform: translate(-6vw, -18vh) scale(0.94);
      }

      75% {
        transform: translate(10vw, -8vh) scale(1.08);
      }
    }

    @keyframes links-lava-d {
      0%,
      100% {
        transform: translate(0, 0) scale(1);
      }

      25% {
        transform: translate(-12vw, -10vh) scale(0.92);
      }

      50% {
        transform: translate(10vw, -16vh) scale(1.12);
      }

      75% {
        transform: translate(-6vw, 8vh) scale(1.02);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .links-blob {
        animation: none;
      }

      .links-avatar {
        transition: none;
      }

      .links-name-fill {
        opacity: 1;
      }

      .links-name-stroke {
        display: none;
      }

      .links-name-svg.is-drawing .links-name-stroke {
        animation: none;
      }
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(28rem, calc(100% - 2.5rem));
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding:
        calc(clamp(2rem, 6vw, 3.25rem) + 2.85rem)
        0
        2.25rem;
    }

    .links-top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.55rem;
      padding:
        max(0.75rem, env(safe-area-inset-top))
        max(0.85rem, env(safe-area-inset-right))
        0.55rem
        max(0.85rem, env(safe-area-inset-left));
      pointer-events: none;
    }

    .links-top-bar > * {
      pointer-events: auto;
    }

    .links-top-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
    }

    .links-corner-pill,
    .links-contact-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.35rem;
      padding: 0.45rem 0.85rem;
      border-radius: var(--radius-pill);
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.01em;
      box-shadow: var(--shadow-soft);
      transition: background 0.25s var(--ease), transform 0.25s var(--ease), border-color 0.25s var(--ease);
      white-space: nowrap;
    }

    .links-corner-pill {
      background: var(--accent);
      color: var(--accent-text);
      min-width: 5.65rem;
    }

    .links-corner-pill:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .links-corner-pill:focus-visible,
    .links-contact-pill:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .links-contact-pill {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
      min-width: 6.35rem;
    }

    .links-contact-pill:hover {
      background: var(--bg-soft);
      border-color: rgba(137, 207, 240, 0.7);
      transform: translateY(-1px);
    }

    .links-share-wrap {
      position: relative;
    }

    .links-share-btn {
      width: 2.35rem;
      height: 2.35rem;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.94);
      color: var(--ink);
      box-shadow: var(--shadow-soft);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.25s var(--ease), border-color 0.25s var(--ease), transform 0.25s var(--ease);
    }

    .links-share-btn:hover {
      background: #fff;
      border-color: rgba(137, 207, 240, 0.7);
      transform: translateY(-1px);
    }

    .links-share-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .links-share-btn svg {
      width: 1.05rem;
      height: 1.05rem;
      display: block;
    }

    .links-menu-icon {
      width: 1rem;
      height: 0.72rem;
      position: relative;
      display: block;
    }

    .links-menu-icon span {
      position: absolute;
      left: 0;
      width: 100%;
      height: 2px;
      background: currentColor;
      border-radius: 2px;
    }

    .links-menu-icon span:nth-child(1) {
      top: 0;
    }

    .links-menu-icon span:nth-child(2) {
      top: 5px;
    }

    .links-menu-icon span:nth-child(3) {
      top: 10px;
    }

    .links-share-menu {
      position: absolute;
      top: calc(100% + 0.45rem);
      right: 0;
      min-width: 11.5rem;
      padding: 0.35rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 14px 36px rgba(20, 21, 26, 0.14);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px) scale(0.98);
      transform-origin: top right;
      transition: opacity 0.2s var(--ease), transform 0.2s var(--ease), visibility 0.2s var(--ease);
    }

    .links-share-wrap.is-open .links-share-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .links-share-menu button,
    .links-share-menu a {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s var(--ease);
    }

    .links-share-menu button:hover,
    .links-share-menu a:hover {
      background: var(--bg-soft);
    }

    .links-share-menu button:focus-visible,
    .links-share-menu a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .links-share-menu svg {
      width: 1rem;
      height: 1rem;
      flex-shrink: 0;
    }

    .page-intro {
      width: 100%;
      margin-bottom: 0.35rem;
      text-align: center;
      --avatar-size: clamp(6.85rem, 21vw, 7.75rem);
      --avatar-border: 3.5px;
      --avatar-gap: 0.95rem;
    }

    .page-intro.is-scrolled {
      --avatar-size: 5.5rem;
      --avatar-border: 3px;
      --avatar-gap: 0.85rem;
    }

    .links-avatar {
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      border: var(--avatar-border) solid #fff;
      box-shadow: var(--shadow-soft);
      margin: 0 auto var(--avatar-gap);
      display: block;
      transition:
        width 0.4s var(--ease),
        height 0.4s var(--ease),
        border-width 0.4s var(--ease),
        margin 0.4s var(--ease);
    }

    .page-intro h1 {
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .links-name-svg {
      width: min(100%, 22.5rem);
      height: auto;
      display: block;
      overflow: visible;
      flex: 0 1 auto;
    }

    .links-verified {
      flex: 0 0 auto;
      width: 1.15rem;
      height: 1.15rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #1d9bf0;
      margin-top: 0.1rem;
    }

    .links-verified svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .links-name-fill {
      fill: #163a5a;
      opacity: 0;
      transition: opacity 0.12s var(--ease);
    }

    .links-name-stroke {
      fill: none;
      stroke: #163a5a;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transition: opacity 0.15s var(--ease);
    }

    .links-name-svg.is-complete .links-name-stroke {
      opacity: 0;
    }

    .links-handle {
      margin: 0.15rem 0 0;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      text-align: center;
    }

    .links-bio {
      margin: 0.5rem auto 0;
      max-width: 22rem;
      font-size: 0.94rem;
      line-height: 1.5;
      color: var(--ink-muted);
      text-align: center;
    }

    .page-intro .link-icons {
      margin-top: 0.9rem;
      margin-bottom: 0.15rem;
    }

    .link-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 1.35rem;
      margin-bottom: 0.35rem;
    }

    .link-group h2 {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      text-align: center;
      margin-bottom: 0.15rem;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      width: 100%;
      min-height: 3.85rem;
      padding: 0.65rem 1.15rem 0.65rem 0.65rem;
      border: 1.5px solid #14151a;
      border-radius: var(--radius-pill);
      background: #fff;
      box-shadow: var(--shadow-soft);
      font-weight: 700;
      transition:
        transform 0.25s var(--ease),
        background 0.25s var(--ease),
        box-shadow 0.25s var(--ease);
    }

    .link-btn:hover {
      transform: translateY(-2px);
      background: #fff;
      box-shadow: 0 14px 34px rgba(20, 21, 26, 0.12);
    }

    .link-btn--wiggle {
      animation: links-btn-wiggle 2.4s ease-in-out infinite;
      transform-origin: 50% 50%;
    }

    .link-btn--wiggle:hover {
      animation-play-state: paused;
    }

    @keyframes links-btn-wiggle {
      0%,
      8%,
      100% {
        transform: rotate(0deg);
      }

      2% {
        transform: rotate(1.4deg);
      }

      4% {
        transform: rotate(-1.2deg);
      }

      6% {
        transform: rotate(0.8deg);
      }

      7% {
        transform: rotate(-0.4deg);
      }
    }

    .link-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .link-btn-icon {
      display: grid;
      place-items: center;
      flex: 0 0 2.35rem;
      width: 2.35rem;
      height: 2.35rem;
      border-radius: 50%;
      background: #fff;
      overflow: hidden;
      border: 1.5px solid #14151a;
    }

    .link-btn-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .link-btn-text {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      min-width: 0;
      text-align: left;
    }

    .link-btn-text strong {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .link-btn-text small {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--ink-muted);
    }

    .links-foot {
      margin-top: 2.25rem;
      text-align: center;
      color: var(--ink-muted);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .links-foot a {
      color: inherit;
    }

    .link-icons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.55rem;
      margin-top: 0.35rem;
    }

    .link-icons a {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      background: var(--surface);
      border: 1.5px solid #14151a;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s var(--ease), background 0.25s var(--ease), border-color 0.25s var(--ease);
    }

    .link-icons a:hover {
      transform: translateY(-2px);
      background: rgba(137, 207, 240, 0.92);
      border-color: #14151a;
    }

    .link-icons a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .link-icons img {
      width: 1.15rem;
      height: 1.15rem;
      display: block;
    }

    @media (max-width: 900px) {
      .link-icons {
        flex-wrap: nowrap;
        justify-content: flex-start;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x proximity;
        overscroll-behavior-x: contain;
        scrollbar-width: none;
        padding: 0.1rem 0;
      }

      .link-icons::-webkit-scrollbar {
        display: none;
      }

      .link-icons a {
        flex-shrink: 0;
        scroll-snap-align: start;
      }

      .page-intro .link-icons a {
        width: 2.3rem;
        height: 2.3rem;
      }

      .page-intro .link-icons img {
        width: 1.05rem;
        height: 1.05rem;
      }

      .page-intro .link-icons {
        justify-content: center;
        flex-wrap: wrap;
        overflow-x: visible;
        scroll-snap-type: none;
        max-width: 22.5rem;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>

  <script>
    (function () {
      var shareWrap = document.getElementById("linksShareWrap");
      var shareBtn = document.getElementById("linksShareBtn");
      var shareMenu = document.getElementById("linksShareMenu");
      var shareNative = document.getElementById("linksShareNative");
      var shareCopy = document.getElementById("linksShareCopy");
      var shareCopyLabel = document.getElementById("linksShareCopyLabel");
      if (!shareWrap || !shareBtn || !shareMenu) return;

      var pageUrl = window.location.href;
      var pageTitle = document.title;
      var shareText = "All of Cristian Paez Jr’s links — web projects, socials, and more.";

      if (navigator.share) {
        shareNative.hidden = false;
      }

      function setMenuOpen(open) {
        shareWrap.classList.toggle("is-open", open);
        shareBtn.setAttribute("aria-expanded", open ? "true" : "false");
        shareMenu.hidden = !open;
      }

      function closeMenu() {
        setMenuOpen(false);
      }

      shareBtn.addEventListener("click", function () {
        setMenuOpen(!shareWrap.classList.contains("is-open"));
      });

      document.addEventListener("click", function (event) {
        if (!shareWrap.contains(event.target)) closeMenu();
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") closeMenu();
      });

      shareNative.addEventListener("click", function () {
        navigator.share({
          title: pageTitle,
          text: shareText,
          url: pageUrl
        }).then(closeMenu).catch(function () {});
      });

      shareCopy.addEventListener("click", function () {
        function markCopied() {
          if (shareCopyLabel) {
            var original = shareCopyLabel.textContent;
            shareCopyLabel.textContent = "Copied!";
            window.setTimeout(function () {
              shareCopyLabel.textContent = original;
            }, 1600);
          }
          closeMenu();
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(pageUrl).then(markCopied).catch(function () {});
          return;
        }

        var input = document.createElement("input");
        input.value = pageUrl;
        document.body.appendChild(input);
        input.select();
        try {
          document.execCommand("copy");
          markCopied();
        } catch (err) {}
        document.body.removeChild(input);
      });
    })();

    (function () {
      var intro = document.getElementById("linksIntro");
      var primaryPill = document.getElementById("linksPrimaryPill");
      var secondaryPill = document.getElementById("linksSecondaryPill");
      var threshold = 28;

      var subscribeState = {
        href: "https://www.iamchrispaezjr.com/#mc_embed_signup",
        label: "Subscribe",
        aria: "Subscribe to newsletter"
      };
      var storeState = {
        href: "https://www.iamchrispaezjrstore.com",
        label: "Store",
        aria: "Store",
        external: true
      };
      var contactState = {
        href: "../contact/",
        label: "Contact Me",
        aria: "Contact Me"
      };
      var patreonState = {
        href: "https://www.patreon.com/cw/cristianpaezjr/membership",
        label: "Patreon",
        aria: "Patreon",
        external: true
      };

      function applyPill(el, state) {
        if (!el) return;
        el.href = state.href;
        el.textContent = state.label;
        el.setAttribute("aria-label", state.aria);
        if (state.external) {
          el.target = "_blank";
          el.rel = "noopener noreferrer";
        } else {
          el.removeAttribute("target");
          el.removeAttribute("rel");
        }
      }

      function syncScrollState() {
        var scrolled = window.scrollY > threshold;
        if (intro) intro.classList.toggle("is-scrolled", scrolled);
        applyPill(primaryPill, scrolled ? storeState : subscribeState);
        applyPill(secondaryPill, scrolled ? patreonState : contactState);
      }

      window.addEventListener("scroll", syncScrollState, { passive: true });
      syncScrollState();
    })();

    (function () {
      var LETTER_MS = 420;
      var LETTER_GAP = 55;
      var svg = document.getElementById("linksNameSvg");
      var lettersRoot = document.getElementById("linksNameLetters");
      if (!svg || !lettersRoot) return;

      var NS = "http://www.w3.org/2000/svg";
      var fills = [];
      var strokes = [];
      var letterChars = [];

      function showComplete() {
        svg.classList.add("is-complete");
        fills.forEach(function (fill) {
          fill.style.opacity = "1";
        });
        strokes.forEach(function (stroke) {
          stroke.style.opacity = "0";
        });
      }

      function buildLetters(letters) {
        letters.forEach(function (letter) {
          var group = document.createElementNS(NS, "g");
          group.classList.add("links-name-letter");

          var fill = document.createElementNS(NS, "path");
          fill.classList.add("links-name-fill");
          fill.setAttribute("d", letter.d);

          var stroke = document.createElementNS(NS, "path");
          stroke.classList.add("links-name-stroke");
          stroke.setAttribute("d", letter.d);

          group.appendChild(fill);
          group.appendChild(stroke);
          lettersRoot.appendChild(group);
          fills.push(fill);
          strokes.push(stroke);
          letterChars.push(letter.char || "");
        });
      }

      function animateLetter(index, onDone) {
        var stroke = strokes[index];
        var fill = fills[index];
        if (!stroke || !fill) {
          onDone();
          return;
        }
        var length = stroke.getTotalLength();
        var finished = false;
        var safetyTimer = null;

        function finishLetter() {
          if (finished) return;
          finished = true;
          fill.style.opacity = "1";
          stroke.style.opacity = "0";
          onDone();
        }

        stroke.style.opacity = "1";
        stroke.style.transition = "none";
        stroke.style.strokeDasharray = String(length);
        stroke.style.strokeDashoffset = String(length);
        stroke.getBoundingClientRect();

        stroke.style.transition = "stroke-dashoffset " + LETTER_MS + "ms cubic-bezier(0.33, 1, 0.68, 1)";
        stroke.addEventListener("transitionend", function onLetterDrawn(event) {
          if (event.propertyName !== "stroke-dashoffset") return;
          stroke.removeEventListener("transitionend", onLetterDrawn);
          if (safetyTimer) window.clearTimeout(safetyTimer);
          finishLetter();
        });

        safetyTimer = window.setTimeout(finishLetter, LETTER_MS + 280);

        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            stroke.style.strokeDashoffset = "0";
          });
        });
      }

      function runTrack(indices, pos, onTrackDone) {
        if (pos >= indices.length) {
          onTrackDone();
          return;
        }

        animateLetter(indices[pos], function () {
          window.setTimeout(function () {
            runTrack(indices, pos + 1, onTrackDone);
          }, LETTER_GAP);
        });
      }

      function startDraw() {
        svg.classList.add("is-drawing");

        var starters = [];
        letterChars.forEach(function (ch, idx) {
          if (/^[A-Z]$/.test(ch)) starters.push(idx);
        });

        var trackStarts = starters.length ? starters : [0];
        var tracks = trackStarts.map(function (startIdx, i) {
          var endExclusive = i + 1 < trackStarts.length ? trackStarts[i + 1] : strokes.length;
          var indices = [];
          for (var j = startIdx; j < endExclusive; j += 1) indices.push(j);
          return indices;
        });

        var doneCount = 0;
        function finishAllTracks() {
          doneCount += 1;
          if (doneCount !== tracks.length) return;
          showComplete();
        }

        tracks.forEach(function (track) {
          runTrack(track, 0, finishAllTracks);
        });
      }

      function initNameDraw(data) {
        if (data.viewBox) {
          svg.setAttribute("viewBox", data.viewBox.join(" "));
        }
        buildLetters(data.letters || []);

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          showComplete();
          return;
        }

        startDraw();
      }

      function showFallbackName() {
        lettersRoot.innerHTML = "";
        var text = document.createElementNS(NS, "text");
        text.setAttribute("x", "50%");
        text.setAttribute("y", "72%");
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("fill", "#163a5a");
        text.setAttribute("font-family", '"Gloria Hallelujah", cursive');
        text.setAttribute("font-size", "32");
        text.textContent = "Cristian Paez Jr";
        lettersRoot.appendChild(text);
        showComplete();
      }

      var pathsEl = document.getElementById("cpjrNamePaths");
      if (pathsEl && pathsEl.textContent) {
        try {
          initNameDraw(JSON.parse(pathsEl.textContent));
        } catch (err) {
          showFallbackName();
        }
      } else {
        fetch("cpjr-name-paths.json")
          .then(function (response) {
            if (!response.ok) throw new Error("path data missing");
            return response.json();
          })
          .then(initNameDraw)
          .catch(showFallbackName);
      }
    })();

    (function () {
      var STING_KEY = "cpjr-links-sting-at";
      var STING_SESSION_KEY = "cpjr-links-sting-session";
      var STING_COOLDOWN_MS = 60 * 60 * 1000;
      var STING_SRC = "../sounds/i-miss-you-t.mp3";

      function canPlaySting() {
        try {
          if (sessionStorage.getItem(STING_SESSION_KEY) === "1") return false;
          var raw = localStorage.getItem(STING_KEY);
          if (!raw) return true;
          var lastAt = Number(raw);
          if (!Number.isFinite(lastAt)) return true;
          return Date.now() - lastAt >= STING_COOLDOWN_MS;
        } catch (err) {
          return true;
        }
      }

      function markStingPlayed() {
        try {
          sessionStorage.setItem(STING_SESSION_KEY, "1");
          localStorage.setItem(STING_KEY, String(Date.now()));
        } catch (err) {}
      }

      if (!canPlaySting()) return;

      var audio = new Audio(STING_SRC);
      audio.preload = "auto";
      var started = false;

      function playSting() {
        if (started) return;
        started = true;
        var playPromise = audio.play();
        if (playPromise && typeof playPromise.then === "function") {
          playPromise
            .then(function () {
              markStingPlayed();
            })
            .catch(function () {
              started = false;
              waitForGesture();
            });
        } else {
          markStingPlayed();
        }
      }

      function waitForGesture() {
        function onGesture() {
          document.removeEventListener("pointerdown", onGesture);
          document.removeEventListener("keydown", onGesture);
          document.removeEventListener("touchstart", onGesture);
          playSting();
        }

        document.addEventListener("pointerdown", onGesture, { once: true });
        document.addEventListener("keydown", onGesture, { once: true });
        document.addEventListener("touchstart", onGesture, { once: true, passive: true });
      }

      playSting();
    })();
  </script>
</body>
</html>
